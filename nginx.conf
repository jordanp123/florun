server {
    listen 8080;
    # Catch-all: host routing is the Cloudflare tunnel's job, and this container
    # is reachable only through it (internal network, no published ports).
    # Keeping `_` here means nothing in this file is deploy-specific.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression. Note application/manifest+json for the web app manifest --
    # without it the manifest is served uncompressed and, on some setups, with
    # the wrong type entirely (see the types block below).
    gzip on;
    gzip_types text/plain text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 64;

    # ── Hide Nginx version from error pages and headers ──────────────
    server_tokens off;

    # ── Security headers ─────────────────────────────────────────────
    # A header CSP is stronger than the <meta> fallback in index.html, and
    # frame-ancestors (clickjacking protection) ONLY works as a header --
    # browsers ignore it inside a <meta> CSP. `always` = also on 404/405.
    #
    # This app ships zero inline scripts, no eval, no inline event handlers and
    # makes no network requests of its own. The only relaxations from
    # `default-src 'none'` are:
    #   img-src blob:   captured photos live as Blobs in IndexedDB and are
    #                   displayed through object URLs. Deliberately NOT in
    #                   script-src -- a blob: script is the exact injection
    #                   vector this policy exists to stop.
    #   img-src data:   the inline SVG favicon fallback.
    #   worker-src      the service worker (offline support).
    #   manifest-src    the web app manifest (installability).
    #   connect-src     the service worker revalidating its own precached,
    #                   same-origin assets. Nothing else fetches anything.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # The app asks for geolocation and camera itself; nothing else on the page
    # should ever get them, and no third party can be embedded to try.
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # ── Caching ──────────────────────────────────────────────────────
    # Filenames are NOT content-hashed, so nothing may be cached as immutable:
    # a year-long "immutable" would pin a stale service worker at the browser
    # and the edge, and the SW is precisely the file that must be allowed to
    # update. no-cache still permits conditional revalidation -- unchanged
    # files answer 304, so this costs a round trip, not a re-download. Offline
    # speed comes from the service worker's own cache, not from HTTP caching.
    add_header Cache-Control "no-cache" always;

    # ── Only allow GET and HEAD -- no POST, PUT, DELETE etc ──────────
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # ── Never emit an absolute redirect ──────────────────────────────
    # This server listens on 8080 but is reached through the tunnel on 443, so
    # any absolute Location it builds leaks "http://host:8080/..." -- a URL no
    # client can reach. Relative Locations are always correct here.
    absolute_redirect off;

    # ── Clean URLs ───────────────────────────────────────────────────
    # Resolve a directory's index file DIRECTLY ($uri/index.html) rather than
    # letting nginx 301 "/dir" -> "/dir/" and re-enter routing. Edge URL
    # normalization that strips trailing slashes can otherwise turn that
    # redirect into an infinite loop.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # The manifest MUST be served as application/manifest+json; the stock nginx
    # mime.types has no entry for .webmanifest and would fall back to
    # application/octet-stream, which browsers refuse to parse -- the app then
    # silently stops being installable.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
    }

    # The service worker's scope is capped by its own path, so serving it from
    # the root is what allows it to control the whole origin. Explicitly typed
    # and explicitly uncacheable: a stale SW is the classic way a PWA strands
    # users on an old build.
    #
    # IMPORTANT: a location-level add_header REPLACES the inherited set rather
    # than adding to it, so every server-level header above has to be repeated
    # here verbatim. Omitting them would silently ship the service worker --
    # the most security-sensitive file in the app -- without HSTS, COOP,
    # Referrer-Policy or Permissions-Policy. Change one, change both.
    location = /sw.js {
        types { } default_type application/javascript;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # ── Block access to hidden files (.git, .env etc) ────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Block common exploit probes ──────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi|sh|py|pl|rb)$ {
        deny all;
        return 404;
    }

    # ── Custom 404 ───────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
